# PrisonBreak Configuration

game:
  # Minimum players needed to start
  min-players: 2
  # Maximum players in a game
  max-players: 20
  # Game duration in seconds (0 = unlimited)
  game-duration: 600
  # Countdown before game starts (seconds)
  countdown: 30

  # How many prisoners need to escape to end the game
  escapes-to-win: 5

  # Money earned when prisoner escapes
  escape-reward: 500
  # Money earned when police arrests a prisoner
  arrest-reward: 200
  # Money prisoners start with
  prisoner-start-money: 0
  # Money police start with
  police-start-money: 100

arrest:
  # Radius in blocks for police to arrest prisoners
  arrest-radius: 2.5
  # Cooldown between arrests in seconds
  arrest-cooldown: 3

respawn:
  # Delay before respawning in prison after arrest (seconds)
  respawn-delay: 3

messages:
  prefix: "&8[&c&lPrison&f&lBreak&8] "
  escaped: "&a{player} &fhapishaneden kaçtı! &e(+{money}₺)"
  arrested: "&c{player} &ftutuklandı! Polis: &b{police} &e(+{money}₺)"
  game-start: "&aOyun başladı! &7Mahkumlar: &cKaçın! &7Polisler: &9Yakalayın!"
  game-end-prisoners: "&6Mahkumlar kazandı! &e{escapes} kişi kaçtı!"
  game-end-police: "&9Polisler kazandı! Tüm kaçışları durdurdu!"
  not-in-game: "&cBu komutu kullanmak için oyunda olmalısın!"
  already-in-game: "&cZaten bir oyundasın!"
  game-full: "&cOyun dolu!"
  no-game: "&cŞu an aktif bir oyun yok!"
  joined: "&aOyuna katıldın! Rol: &e{role}"

# Locations (set via /pbadmin setup commands, do not edit manually)
locations:
  prisoner-spawn: null
  police-spawn: null
  escape-point: null
  arrest-point: null
  cell-spawn: null
