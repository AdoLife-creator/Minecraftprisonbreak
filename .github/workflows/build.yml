name: Build PrisonBreak

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: mvn clean package

      - name: Create ZIP
        run: |
          mkdir release
          cp target/*.jar release/
          cd release
          zip -r PrisonBreak.zip .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PrisonBreak
          path: release/PrisonBreak.zip
