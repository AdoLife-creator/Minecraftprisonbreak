name: Build PrisonBreak

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Plugin
        run: mvn clean package

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: PrisonBreak
          path: target/*.jar
